send_follow_me:
  name: Send Follow Me
  description: Send a Midea Follow Me IR command through a Moes UFO-R11 (TS1201) or similar ZHA-connected IR blaster device.
  target:
    entity:
      integration: zha
      domain:
        - switch
        - light
        - fan
    device:
      integration: zha
  fields:
    ieee:
      name: IEEE address
      description: IEEE address of the IR blaster (e.g., 00:0d:6f:00:05:7d:2d:34). Only needed when the blaster cannot be targeted with an entity, device or area.
      required: false
      example: "00:0d:6f:00:05:7d:2d:34"
      selector:
        text:
    temperature:
      name: Temperature
      description: Temperature value to send
      required: true
      example: 22.5
      selector:
        number:
          mode: box
          min: 0
          max: 99
          step: 0.5
    use_fahrenheit:
      name: Use Fahrenheit
      description: Use Fahrenheit scale instead of Celsius
      required: false
      default: false
      selector:
        boolean: {}
    beeper:
      name: Beeper
      description: Enable beeper feedback on the device
      required: false
      default: false
      selector:
        boolean: {}

debug_follow_me:
  name: Debug Follow Me
  description: Debug service to display the final Tuya IR payload used by TS1201
  fields:
    temperature:
      name: Temperature
      description: Temperature value to evaluate
      required: true
      example: 22.5
      selector:
        number:
          mode: box
          min: 0
          max: 99
          step: 0.1
    use_fahrenheit:
      name: Use Fahrenheit
      description: Use Fahrenheit scale instead of Celsius
      required: false
      default: false
      selector:
        boolean: {}
    beeper:
      name: Beeper
      description: Enable beeper feedback on the device
      required: false
      default: false
      selector:
        boolean: {}
